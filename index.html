/* ─── Countdown Timer ────────────────────────────────────────────────────────── */
function Countdown({ seconds }) {
  const [remaining, setRemaining] = useState(seconds);
  useEffect(()=>{
    if(remaining <= 0) return;
    const iv = setInterval(()=> setRemaining(r => r-1), 1000);
    return ()=> clearInterval(iv);
  },[]);
  const m = Math.floor(remaining/60).toString().padStart(2,'0');
  const s = (remaining%60).toString().padStart(2,'0');
  const expired = remaining <= 0;
  return html`
    <div class="countdown-wrap" style=${{ color: expired ? '#ef4444' : remaining < 120 ? '#ef4444' : 'rgba(245,158,11,0.7)' }}>
      <span>⏱</span>
      <span>${expired ? 'OFFER EXPIRED' : `LOCK EXPIRES IN ${m}:${s}`}</span>
    </div>
  `;
}

/* ─── SSN Input with masking ─────────────────────────────────────────────────── */
function SSNInput({ value, onChange }) {
  const [showFull, setShowFull] = useState(false);
  const [rawVal, setRawVal]     = useState(value || '');

  function handleChange(e) {
    let v = e.target.value.replace(/\D/g,'').slice(0,9);
    setRawVal(v);
    let formatted = v;
    if(v.length > 5) formatted = v.slice(0,3)+'-'+v.slice(3,5)+'-'+v.slice(5);
    else if(v.length > 3) formatted = v.slice(0,3)+'-'+v.slice(3);
    onChange(formatted);
  }

  const displayVal = showFull ? value : value ? '●●●-●●-' + (rawVal.slice(-4) || '____') : '';

  return h('div', { style:{ position:'relative' } },
    h('input', {
      type: 'text',
      value: showFull ? value : displayVal,
      onChange: showFull ? handleChange : ()=>{},
      onFocus: ()=> setShowFull(true),
      onBlur:  ()=> setShowFull(false),
      placeholder: '●●●-●●-●●●●',
      style: inp({ letterSpacing: showFull ? 'normal' : '3px' }),
      autoComplete: 'off',
      inputMode: 'numeric',
    }),
    h('button', {
      type:'button',
      onClick:()=> setShowFull(f=>!f),
      style:{
        position:'absolute', right:12, top:'50%', transform:'translateY(-50%)',
        background:'none', border:'none', cursor:'pointer',
        color:'rgba(255,255,255,0.25)', fontSize:12, ...mono,
        padding:'4px 6px',
      }
    }, showFull ? 'HIDE' : 'SHOW')
  );
}

/* ─── Promo Code Input ────────────────────────────────────────────────────────── */
function PromoInput({ onApply }) {
  const [code,    setCode]    = useState('');
  const [result,  setResult]  = useState(null); // null | { valid, label, extraOff }
  const [checked, setChecked] = useState(false);

  function apply() {
    const upper = code.toUpperCase().trim();
    const match = PROMO_CODES[upper];
    if(match) {
      setResult({ valid:true, label:match.label, extraOff:match.extraOff, code:upper });
      onApply({ valid:true, code:upper, extraOff:match.extraOff, label:match.label });
    } else {
      setResult({ valid:false });
      onApply({ valid:false });
    }
    setChecked(true);
  }

  return html`
    <div style=${{ marginBottom:20 }}>
      <label style=${lbl}>Promo / Referral Code <span style=${{ color:'rgba(255,255,255,0.2)' }}>(optional)</span></label>
      <div style=${{ display:'flex', gap:8 }}>
        <input type="text" value=${code} onChange=${e=>{ setCode(e.target.value); setChecked(false); setResult(null); onApply(null); }}
          placeholder="e.g. ALDER10" style=${{ ...inp(), flex:1, textTransform:'uppercase', letterSpacing:'.06em' }}
          onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); apply(); } }}
        />
        <button type="button" onClick=${apply} style=${{
          ...btn('rgba(16,185,129,0.15)'), padding:'12px 16px', fontSize:13,
          border:'1px solid rgba(16,185,129,0.25)', color:'#10b981', whiteSpace:'nowrap',
        }}>Apply</button>
      </div>
      ${checked && result?.valid && html`
        <div style=${{ display:'flex', alignItems:'center', gap:8, marginTop:8, animation:'slideDown .3s both' }}>
          <span style=${{ color:'#10b981', fontSize:14 }}>✓</span>
          <span class="promo-badge">🎟 ${result.code} · ${result.label}</span>
          <span class="savings-pill">-$${result.extraOff}/mo extra</span>
        </div>
      `}
      ${checked && result && !result.valid && html`
        <div style=${{ ...mono, fontSize:10.5, color:'rgba(239,68,68,0.7)', marginTop:8, animation:'slideDown .3s both' }}>
          ✕ Code not recognized — leave blank to continue
        </div>
      `}
    </div>
  `;
}

/* ─── Waiting Screen ──────────────────────────────────────────────────────────── */
function WaitingScreen({ rowId, onApproved, onDenied }) {
  const [dots,  setDots]  = useState('');
  const [phase, setPhase] = useState('submitting');

  useEffect(()=>{
    const iv = setInterval(()=> setDots(d=> d.length>=3?'':d+'.'), 500);
    const t1 = setTimeout(()=> setPhase('waiting'), 1500);
    return ()=>{ clearInterval(iv); clearTimeout(t1); };
  },[]);

  useEffect(()=>{
    if(!rowId) return;
    const ch = sb.channel(`approval-${rowId}`)
      .on('postgres_changes',{
        event:'UPDATE', schema:'public', table:'site_approvals',
        filter:`id=eq.${rowId}`,
      }, payload => {
        const s = payload.new?.status;
        if(s==='approved') onApproved(payload.new);
        if(s==='denied')   onDenied(payload.new);
      })
      .subscribe();
    return ()=> sb.removeChannel(ch);
  },[rowId]);

  const stages = [
    { id:'encrypt', label:'Encrypting personal data',              done:true  },
    { id:'submit',  label:'Sending to Corporate Discount Desk',    done:true  },
    { id:'verify',  label:'Verifying corporate eligibility',       done:false },
    { id:'approve', label:'Discount tier assignment pending',      done:false },
  ];

  return html`
    <div class="scan-wrap fade" style=${{ padding:'8px 0' }}>
      <div class="scan-line"></div>
      <div style=${{
        width:72, height:72, borderRadius:'50%', margin:'0 auto 20px',
        background:'rgba(16,185,129,0.08)',
        border:'2px solid rgba(16,185,129,0.3)',
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:28,
        animation:'breathe 2.5s ease-in-out infinite',
      }}>⏳</div>

      <div style=${{ textAlign:'center', marginBottom:28 }}>
        <div style=${{ ...mono, fontSize:10, color:'#10b981', letterSpacing:'.2em', marginBottom:8 }}>
          ${phase==='submitting' ? 'TRANSMITTING'+dots : 'AWAITING CORPORATE DESK'+dots}
        </div>
        <h2 style=${{ fontSize:22, fontWeight:700, lineHeight:1.2 }}>
          ${phase==='submitting' ? 'Sending to discount team…' : 'Discount desk is reviewing'}
        </h2>
        <p style=${{ color:'rgba(255,255,255,0.3)', fontSize:13.5, marginTop:6, lineHeight:1.5 }}>
          Our corporate discount team is verifying<br/>your eligibility and assigning your tier.
        </p>
      </div>

      <div style=${{ marginBottom:24 }}>
        ${stages.map((st,i)=>html`
          <div key=${st.id} style=${{
            display:'flex', alignItems:'center', gap:12, padding:'11px 0',
            borderBottom: i<stages.length-1 ? '1px solid rgba(255,255,255,0.05)' : 'none',
          }}>
            <div style=${{
              width:28, height:28, borderRadius:'50%', flexShrink:0,
              background: st.done ? 'rgba(16,185,129,0.15)' : 'rgba(255,255,255,0.04)',
              border:`1px solid ${st.done ? 'rgba(16,185,129,0.4)' : 'rgba(255,255,255,0.1)'}`,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:12,
            }}>
              ${st.done ? '✓' : i===2 ? html`<${Spinner} size=${12} />` : '○'}
            </div>
            <div style=${{
              ...mono, fontSize:11,
              color: st.done ? 'rgba(16,185,129,0.7)' : i===2 ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)',
              letterSpacing:'.04em',
            }}>${st.label}</div>
          </div>
        `)}
      </div>

      <div style=${{
        padding:'12px 14px', background:'rgba(245,158,11,0.06)',
        border:'1px solid rgba(245,158,11,0.15)', borderRadius:10,
        ...mono, fontSize:10.5, color:'rgba(245,158,11,0.6)',
        lineHeight:1.6, letterSpacing:'.03em',
      }}>
        ⚠️ Keep this screen open — your discount rate will appear here automatically once the corporate desk assigns your tier.
      </div>
    </div>
  `;
}

      monthly_rmr:   null,
      package_name:  null,
      panel_type:    null,
      sales_config:  null,

    const { data, error } = await sb.from('site_approvals').insert([payload]).select().single();
    setSubmitting(false);
    if(error){ console.error(error); setSubmitErr('Submission failed. Please try again.'); return; }
    setRowId(data.id);

  const TOTAL = 3;

  return html`

            ${!rowId && !deniedData && html`

            <div style=${{ display:'flex', gap:0, flexWrap:'wrap', borderTop:'1px solid rgba(255,255,255,0.05)', marginTop:22 }}>

/* ─── SSN display — analyst can toggle full reveal ────────────────────────────── */
function AnalystSSN({ ssn }) {
  const [show, setShow] = useState(false);
  if(!ssn) return h('span',{style:{color:'rgba(255,255,255,0.2)'}}, '—');
  const digits = ssn.replace(/\D/g,'');
  const last4  = digits.slice(-4);
  const masked = `●●●-●●-${last4}`;
  return h('div', { style:{ display:'flex', alignItems:'center', gap:8 } },
    h('span',{ style:{ ...mono, fontSize:13.5, fontWeight:600, color:'#e2e8f0', letterSpacing: show?'normal':'2px' }},
      show ? ssn : masked
    ),
    h('button', {
      type:'button',
      onClick:()=>setShow(s=>!s),
      style:{
        ...mono, fontSize:9, padding:'3px 8px', borderRadius:5, cursor:'pointer',
        background: show ? 'rgba(239,68,68,0.12)' : 'rgba(16,185,129,0.1)',
        border: show ? '1px solid rgba(239,68,68,0.25)' : '1px solid rgba(16,185,129,0.2)',
        color: show ? 'rgba(239,68,68,0.7)' : 'rgba(16,185,129,0.6)',
        letterSpacing:'.07em',
      }
    }, show ? 'HIDE' : 'REVEAL')
  );
}

/* ─── Analyst: Discount Assignment Panel ─────────────────────────────────────── */
function DiscountPanel({ job, onClose, onApprove, onDeny }) {
  const [tierId,    setTierId]    = useState('standard');
  const [pkgId,     setPkgId]    = useState(null);
  const [promoCode, setPromoCode] = useState('');
  const [promoResult,setPromoResult] = useState(null);
  const [denialReason,setDenialReason] = useState('');
  const [loading,   setLoading]  = useState(false);
  const [denyLoad,  setDenyLoad] = useState(false);
  const [showDeny,  setShowDeny] = useState(false);

  const tier     = DISCOUNT_TIERS.find(t=>t.id===tierId) || DISCOUNT_TIERS[0];
  const pkgList  = tier.packages;
  const selected = pkgList.find(p=>p.id===pkgId) || pkgList[0];

  useEffect(()=>{
    setPkgId(pkgList[0].id);
  },[tierId]);

  function applyPromo() {
    const upper = promoCode.toUpperCase().trim();
    const match = PROMO_CODES[upper];
    setPromoResult(match ? { valid:true, ...match, code:upper } : { valid:false });
  }

  const extraOff    = promoResult?.valid ? promoResult.extraOff : 0;
  const finalRmr    = Math.max(0, selected.rmr - extraOff);
  const retailPrice = RETAIL_PRICES[selected.retailKey] || null;
  const savings     = retailPrice ? (retailPrice - finalRmr).toFixed(2) : null;
  const savingsPct  = retailPrice ? Math.round((retailPrice - finalRmr)/retailPrice*100) : null;

  const panelMap = { combo:'ConnectPlus', nvr:'No Security Panel' };
  const configFor = (pkg) => pkg.id.startsWith('c') ? 'Combo (NVR + Security)' : 'NVR Camera Only';

  async function handleApprove() {
    setLoading(true);
    const { error } = await sb.from('site_approvals').update({
      status:        'approved',
      sales_config:  configFor(selected),
      package_name:  selected.label,
      panel_type:    selected.id.startsWith('c') ? 'ConnectPlus' : 'No Security Panel',
      monthly_rmr:   finalRmr,
      discount_tier: tierId,
      retail_key:    selected.retailKey,
      promo_applied: promoResult?.valid ? promoResult.code : null,
    }).eq('id', job.id);
    setLoading(false);
    if(!error) onApprove(job.id);
  }

  async function handleDeny() {
    setDenyLoad(true);
    await sb.from('site_approvals').update({
      status: 'denied',
      denial_reason: denialReason || 'Corporate eligibility could not be verified.',
    }).eq('id', job.id);
    setDenyLoad(false);
    onDeny(job.id);
  }

  return html`
    <div style=${{
      position:'fixed', inset:0, background:'rgba(4,6,10,0.88)',
      backdropFilter:'blur(10px)', zIndex:200,
      display:'flex', alignItems:'flex-end', justifyContent:'center',
      animation:'fadeIn .2s both',
    }} onClick=${e=>{ if(e.target===e.currentTarget)onClose(); }}>

      <div style=${{
        width:'100%', maxWidth:580,
        background:'#0e1220',
        border:'1px solid rgba(255,255,255,0.1)',
        borderRadius:'18px 18px 0 0',
        maxHeight:'94vh', overflowY:'auto',
        animation:'fadeUp .35s cubic-bezier(.16,1,.3,1) both',
      }}>
        <div style=${{ display:'flex', justifyContent:'center', padding:'12px 0 0' }}>
          <div style=${{ width:36, height:4, borderRadius:2, background:'rgba(255,255,255,0.1)' }}></div>
        </div>

        <div style=${{ padding:'16px 22px 32px' }}>
          <!-- Header -->
          <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
            <div>
              <div style=${{ ...mono, fontSize:9, color:'rgba(16,185,129,0.5)', letterSpacing:'.16em', marginBottom:4 }}>CORPORATE DISCOUNT REQUEST</div>
              <h3 style=${{ fontSize:22, fontWeight:700 }}>${job.customer_name||'Unknown'}</h3>
              <div style=${{ ...mono, fontSize:10, color:'rgba(255,255,255,0.3)', marginTop:2 }}>
                🏢 ${job.rep_name || 'Employer not specified'}
              </div>
            </div>
            <button onClick=${onClose} style=${{ background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:8, color:'rgba(255,255,255,0.4)', cursor:'pointer', padding:'7px 12px', fontSize:13 }}>✕</button>
          </div>

          <!-- Customer info -->
          <div style=${{ background:'rgba(255,255,255,0.025)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:12, marginBottom:18, overflow:'hidden' }}>
            ${[
              ['Phone',    job.phone   || '—'],
              ['Email',    job.email   || '—'],
              ['Address',  [job.address, job.city, job.state, job.zip].filter(Boolean).join(', ') || '—'],
              ['DOB',      job.dob     || '—'],
            ].map(([k,v],i,arr)=>html`
              <div key=${k} style=${{ display:'flex', gap:14, padding:'11px 15px', borderBottom: i<arr.length-1?'1px solid rgba(255,255,255,0.05)':'none' }}>
                <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.22)', letterSpacing:'.1em', minWidth:58, paddingTop:2 }}>${k}</div>
                <div style=${{ fontSize:13.5, fontWeight:600, color:'#e2e8f0', wordBreak:'break-all' }}>${v}</div>
              </div>
            `)}
            <div style=${{ display:'flex', gap:14, padding:'11px 15px' }}>
              <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.22)', letterSpacing:'.1em', minWidth:58, paddingTop:2 }}>SSN</div>
              <div style=${{ flex:1 }}>
                <${AnalystSSN} ssn=${job.ssn} />
              </div>
            </div>
          </div>

          <!-- Tier selector -->
          <div style=${{ marginBottom:16 }}>
            <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.22)', letterSpacing:'.12em', marginBottom:10 }}>ASSIGN DISCOUNT TIER</div>
            <div style=${{ display:'flex', gap:6, flexDirection:'column' }}>
              ${DISCOUNT_TIERS.map(t=>html`
                <div key=${t.id} onClick=${()=>setTierId(t.id)} style=${{
                  padding:'12px 14px', borderRadius:10, cursor:'pointer',
                  background: tierId===t.id ? t.dimColor : 'rgba(255,255,255,0.03)',
                  border:`1.5px solid ${tierId===t.id ? t.borderColor : 'rgba(255,255,255,0.07)'}`,
                  transition:'all .18s',
                  display:'flex', alignItems:'center', justifyContent:'space-between',
                }}>
                  <div style=${{ display:'flex', alignItems:'center', gap:10 }}>
                    <div style=${{
                      width:10, height:10, borderRadius:'50%',
                      background: tierId===t.id ? t.color : 'rgba(255,255,255,0.15)',
                      transition:'all .18s',
                    }}></div>
                    <div>
                      <div style=${{ fontWeight:700, fontSize:14, color: tierId===t.id ? t.color : 'rgba(255,255,255,0.5)' }}>${t.label}</div>
                      <div style=${{ ...mono, fontSize:9.5, color:'rgba(255,255,255,0.25)', marginTop:2 }}>${t.description}</div>
                    </div>
                  </div>
                  <div style=${{
                    ...mono, fontSize:10, padding:'3px 9px', borderRadius:20,
                    background: tierId===t.id ? t.dimColor : 'rgba(255,255,255,0.04)',
                    border:`1px solid ${tierId===t.id ? t.borderColor : 'rgba(255,255,255,0.08)'}`,
                    color: tierId===t.id ? t.color : 'rgba(255,255,255,0.25)',
                  }}>${t.badge}</div>
                </div>
              `)}
            </div>
          </div>

          <!-- Package options -->
          <div style=${{ marginBottom:16 }}>
            <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.22)', letterSpacing:'.12em', marginBottom:10 }}>SELECT PACKAGE</div>
            <div style=${{ display:'grid', gap:8, gridTemplateColumns:'1fr 1fr' }}>
              ${pkgList.map(pkg => html`
                <div key=${pkg.id} class="tier-opt" onClick=${()=>setPkgId(pkg.id)} style=${{
                  padding:'14px 13px', borderRadius:11, cursor:'pointer',
                  background: pkgId===pkg.id ? 'rgba(16,185,129,0.1)' : 'rgba(255,255,255,0.03)',
                  border:`1.5px solid ${pkgId===pkg.id ? 'rgba(16,185,129,0.5)' : 'rgba(255,255,255,0.07)'}`,
                  transition:'all .18s', position:'relative',
                }}>
                  ${pkgId===pkg.id && html`
                    <div style=${{ position:'absolute', top:8, right:8, width:7, height:7, borderRadius:'50%', background:'#10b981' }}></div>
                  `}
                  <div style=${{ fontSize:12.5, fontWeight:700, color: pkgId===pkg.id?'#e2e8f0':'rgba(255,255,255,0.5)', lineHeight:1.35, marginBottom:6 }}>
                    ${pkg.label}
                  </div>
                  <div style=${{ ...bebas, fontSize:24, color: pkgId===pkg.id?'#10b981':'rgba(255,255,255,0.25)', letterSpacing:'.03em' }}>
                    $${pkg.rmr.toFixed(2)}<span style=${{ fontSize:13, color:'rgba(16,185,129,0.4)' }}>/mo</span>
                  </div>
                  ${RETAIL_PRICES[pkg.retailKey] && html`
                    <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.2)', marginTop:3, textDecoration:'line-through' }}>
                      retail $${RETAIL_PRICES[pkg.retailKey].toFixed(2)}
                    </div>
                  `}
                </div>
              `)}
            </div>
          </div>

          <!-- Promo code (analyst side) -->
          <div style=${{ marginBottom:16 }}>
            <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.22)', letterSpacing:'.12em', marginBottom:10 }}>APPLY PROMO CODE (OPTIONAL)</div>
            <div style=${{ display:'flex', gap:8 }}>
              <input type="text" value=${promoCode}
                onChange=${e=>{ setPromoCode(e.target.value.toUpperCase()); setPromoResult(null); }}
                placeholder="e.g. ALDER10"
                style=${{ ...inp({ flex:1, textTransform:'uppercase', letterSpacing:'.06em' }) }}
                onKeyDown=${e=>{ if(e.key==='Enter'){ e.preventDefault(); applyPromo(); } }}
              />
              <button type="button" onClick=${applyPromo} style=${{
                ...btn('rgba(16,185,129,0.12)'), padding:'12px 14px', fontSize:12,
                border:'1px solid rgba(16,185,129,0.2)', color:'#10b981',
              }}>Apply</button>
            </div>
            ${promoResult?.valid && html`
              <div style=${{ display:'flex', alignItems:'center', gap:8, marginTop:8, animation:'slideDown .3s both' }}>
                <span class="promo-badge">🎟 ${promoResult.code} · ${promoResult.label} · -$${promoResult.extraOff}/mo</span>
              </div>

            ${promoResult && !promoResult.valid && html`
              <div style=${{ ...mono, fontSize:10, color:'rgba(239,68,68,0.7)', marginTop:8 }}>✕ Invalid promo code</div>

          <!-- Rate summary -->
          <div style=${{
            padding:'16px 18px', marginBottom:18,
            background:`linear-gradient(135deg, ${tier.dimColor}, rgba(8,11,18,0.5))`,
            border:`1px solid ${tier.borderColor}`, borderRadius:13,
          }}>
            <div style=${{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
              <div>

                <div style=${{ fontSize:13, fontWeight:600, color:'rgba(255,255,255,0.55)' }}>${selected.label}</div>
                <div style=${{ ...mono, fontSize:9.5, color:'rgba(255,255,255,0.3)', marginTop:3 }}>
                  ${tier.label} · ${tier.badge}
                  ${promoResult?.valid ? ` + ${promoResult.code}` : ''}

              </div>
              <div style=${{ textAlign:'right' }}>
                <div style=${{ ...bebas, fontSize:36, color:tier.color, letterSpacing:'.03em' }}>
                  $${finalRmr.toFixed(2)}<span style=${{ fontSize:16, color:`${tier.color}60` }}>/mo</span>
                </div>
                ${savings && html`
                  <div class="savings-pill" style=${{ display:'inline-block', marginTop:4 }}>
                    SAVES $${savings}/mo · ${savingsPct}% off
                  </div>

              </div>
            </div>
          </div>

          <!-- Deny expanded -->
          ${showDeny && html`
            <div style=${{ marginBottom:14, animation:'slideDown .3s both' }}>
              <div style=${{ ...mono, fontSize:9, color:'rgba(239,68,68,0.5)', letterSpacing:'.12em', marginBottom:8 }}>DENIAL REASON (shown to customer)</div>
              <textarea
                value=${denialReason}
                onChange=${e=>setDenialReason(e.target.value)}
                placeholder="e.g. Employment could not be verified with listed organization"
                rows=3
                style=${{
                  ...inp({ resize:'vertical', lineHeight:1.5 }),
                }}
              ></textarea>
            </div>
          `}

          <!-- Action buttons -->
          <div style=${{ display:'flex', gap:10 }}>
            <button onClick=${()=>{ if(showDeny){ handleDeny(); } else setShowDeny(true); }}
              disabled=${denyLoad||loading}
              style=${{
                ...btn('rgba(239,68,68,0.08)'),
                flex: showDeny ? 1 : '0 0 auto',
                padding:'14px 18px', fontSize:14,
                border:'1px solid rgba(239,68,68,0.2)', color:'rgba(239,68,68,0.7)',
                display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                transition:'all .2s',
              }}>
              ${denyLoad ? html`<${Spinner} size=${14} color="#ef4444"/>` : '✕'} ${showDeny ? 'Confirm Deny' : 'Deny'}
            </button>
            ${showDeny && html`
              <button onClick=${()=>setShowDeny(false)} style=${{
                ...btn('rgba(255,255,255,0.06)'), flex:'0 0 auto', padding:'14px 18px',
                color:'rgba(255,255,255,0.4)', fontSize:13,
              }}>Cancel</button>
            `}
            ${!showDeny && html`
              <button onClick=${handleApprove} disabled=${loading||denyLoad} style=${{
                ...btn(tier.color), flex:1, fontSize:15, padding:'14px',
                display:'flex', alignItems:'center', justifyContent:'center', gap:10,
                opacity: loading ? .75 : 1,
                boxShadow:`0 0 30px ${tier.dimColor}`,
              }}>
                ${loading ? html`<${Spinner} size=${16} /> Locking in…` : `💼  Approve ${tier.badge} Discount`}
              </button>
            `}
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ─── Analyst: lead list card ─────────────────────────────────────────────────── */
function LeadCard({ job, onClick }) {
  const age = (() => {
    const s = Math.floor((Date.now() - new Date(job.created_at).getTime()) / 1000);
    if(s < 60)  return `${s}s ago`;
    if(s < 3600) return `${Math.floor(s/60)}m ago`;
    return `${Math.floor(s/3600)}h ago`;
  })();

  const statusColor = { pending:'#f59e0b', approved:'#10b981', denied:'#ef4444' }[job.status] || '#999';
  const tierData    = job.discount_tier ? DISCOUNT_TIERS.find(t=>t.id===job.discount_tier) : null;

  return html`
    <div class="lead-card" onClick=${onClick} style=${{
      ...card({ padding:'14px 16px' }),
      display:'flex', gap:14, alignItems:'center',
      animation:'fadeUp .3s cubic-bezier(.16,1,.3,1) both',
    }}>
      <div style=${{
        width:42, height:42, borderRadius:10, flexShrink:0,
        background:'rgba(16,185,129,0.08)',
        border:'1px solid rgba(16,185,129,0.15)',
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:18,
      }}>🏢</div>

      <div style=${{ flex:1, minWidth:0 }}>
        <div style=${{ fontWeight:700, fontSize:15, marginBottom:2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          ${job.customer_name || 'Unnamed Lead'}
        </div>
        <div style=${{ ...mono, fontSize:10, color:'rgba(255,255,255,0.3)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          ${job.rep_name ? `🏢 ${job.rep_name}` : (job.phone||job.email||'—')} · ${[job.city,job.state].filter(Boolean).join(', ')||'No address'}
        </div>
      </div>

      <div style=${{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:5, flexShrink:0 }}>
        <div style=${{
          ...mono, fontSize:9, padding:'3px 8px', borderRadius:5,
          background:`rgba(${statusColor==='#f59e0b'?'245,158,11':statusColor==='#10b981'?'16,185,129':'239,68,68'},0.1)`,
          border:`1px solid rgba(${statusColor==='#f59e0b'?'245,158,11':statusColor==='#10b981'?'16,185,129':'239,68,68'},0.25)`,
          color:statusColor, letterSpacing:'.07em', textTransform:'uppercase',
        }}>${job.status}</div>
        ${tierData && html`
          <div style=${{ ...mono, fontSize:9, color: tierData.color, letterSpacing:'.05em' }}>${tierData.badge}</div>
        `}
        <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.2)' }}>${age}</div>
      </div>
    </div>
  `;
}

/* ─── Analyst Dashboard App ───────────────────────────────────────────────────── */
function AnalystApp({ repName }) {
  const [jobs,     setJobs]     = useState([]);
  const [selected, setSelected] = useState(null);
  const [loading,  setLoading]  = useState(true);
  const [filter,   setFilter]   = useState('all');

  useEffect(()=>{
    async function load() {
      const { data } = await sb.from('site_approvals')
        .select('*')
        .order('created_at', { ascending:false })
        .limit(100);
      setJobs(data||[]);
      setLoading(false);
    }
    load();
  },[]);

  useEffect(()=>{
    const ch = sb.channel('analyst-dashboard')
      .on('postgres_changes',{ event:'INSERT', schema:'public', table:'site_approvals' }, payload => {
        setJobs(j => [payload.new, ...j]);
      })
      .on('postgres_changes',{ event:'UPDATE', schema:'public', table:'site_approvals' }, payload => {
        setJobs(j => j.map(r => r.id===payload.new.id ? payload.new : r));
        setSelected(s => s && s.id===payload.new.id ? null : s);
      })
      .subscribe();
    return ()=> sb.removeChannel(ch);
  },[]);

  const filtered = jobs.filter(j => filter==='all' || j.status===filter);

  const counts = {
    all:      jobs.length,
    pending:  jobs.filter(j=>j.status==='pending').length,
    approved: jobs.filter(j=>j.status==='approved').length,
    denied:   jobs.filter(j=>j.status==='denied').length,
  };

  // RMR totals
  const totalRmr    = jobs.filter(j=>j.status==='approved').reduce((acc,j)=>acc+Number(j.monthly_rmr||0),0);
  const pendingCount= counts.pending;

  return html`
    <div style=${{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <${Ticker} />
      <${Header} repName=${repName||'Analyst'} isAnalyst=${true} />

      <div style=${{ flex:1, padding:'22px 18px 60px', maxWidth:660, margin:'0 auto', width:'100%' }}>

        <div class="fade" style=${{ marginBottom:22 }}>
          <div style=${{ ...bebas, fontSize:28, letterSpacing:'.07em', lineHeight:1 }}>DISCOUNT APPROVAL DESK</div>
          <div style=${{ ...mono, fontSize:10, color:'rgba(255,255,255,0.25)', marginTop:4 }}>
            LIVE · ${pendingCount} AWAITING REVIEW · ${counts.approved} APPROVED
          </div>
        </div>

        <!-- Stats row -->
        <div class="fade2" style=${{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:10, marginBottom:20 }}>
          ${[
            { label:'Total',    val:counts.all,                    color:'rgba(255,255,255,0.5)' },
            { label:'Pending',  val:counts.pending,                color:'#f59e0b' },
            { label:'Approved', val:counts.approved,               color:'#10b981' },
            { label:'RMR/mo',   val:`$${totalRmr.toFixed(0)}`,    color:'#3b82f6' },
          ].map(({label,val,color})=>html`
            <div style=${{ ...card({ padding:'12px 10px' }), textAlign:'center' }}>
              <div style=${{ ...bebas, fontSize:24, color, letterSpacing:'.03em', lineHeight:1 }}>${val}</div>
              <div style=${{ ...mono, fontSize:8, color:'rgba(255,255,255,0.2)', marginTop:3, letterSpacing:'.1em' }}>${label}</div>
            </div>
          `)}
        </div>

        <!-- Tier breakdown -->
        <div class="fade3" style=${{ display:'flex', gap:8, marginBottom:16, flexWrap:'wrap' }}>
          ${DISCOUNT_TIERS.map(t=>{
            const cnt = jobs.filter(j=>j.status==='approved'&&j.discount_tier===t.id).length;
            return html`
              <div key=${t.id} style=${{
                flex:'1 1 auto',
                ...card({ padding:'10px 13px' }),
                borderColor: cnt>0 ? t.borderColor : 'rgba(255,255,255,0.07)',
                display:'flex', alignItems:'center', justifyContent:'space-between',
              }}>
                <div style=${{ ...mono, fontSize:9.5, color: cnt>0 ? t.color : 'rgba(255,255,255,0.25)', letterSpacing:'.07em' }}>${t.badge}</div>
                <div style=${{ ...bebas, fontSize:22, color: cnt>0 ? t.color : 'rgba(255,255,255,0.2)' }}>${cnt}</div>
              </div>
            `;
          })}
        </div>

        <!-- Filter tabs -->
        <div style=${{ display:'flex', gap:6, marginBottom:16 }}>
          ${['all','pending','approved','denied'].map(f=>html`
            <button key=${f} onClick=${()=>setFilter(f)} style=${{
              padding:'7px 14px', borderRadius:8, border:'none', cursor:'pointer', fontFamily:'inherit',
              background: filter===f ? 'rgba(16,185,129,0.15)' : 'rgba(255,255,255,0.04)',
              border:`1px solid ${filter===f ? 'rgba(16,185,129,0.35)' : 'rgba(255,255,255,0.07)'}`,
              color: filter===f ? '#10b981' : 'rgba(255,255,255,0.35)',
              fontSize:12, fontWeight:700, ...mono, letterSpacing:'.06em',
              textTransform:'uppercase', transition:'all .15s',
            }}>
              ${f} ${counts[f]>0?`(${counts[f]})`:''}
            </button>
          `)}
        </div>

        ${loading && html`
          <div style=${{ display:'flex', justifyContent:'center', padding:'40px 0' }}>
            <${Spinner} size=${28} />
          </div>
        `}

        ${!loading && filtered.length===0 && html`
          <div style=${{ textAlign:'center', padding:'50px 20px', ...mono, color:'rgba(255,255,255,0.2)', fontSize:12, letterSpacing:'.08em' }}>
            <div style=${{ fontSize:32, marginBottom:12 }}>📭</div>
            NO ${filter.toUpperCase()} REQUESTS<br/>
            <span style=${{ fontSize:10, color:'rgba(255,255,255,0.12)' }}>Waiting for applications…</span>
          </div>
        `}

        <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
          ${filtered.map(job=>html`
            <${LeadCard}
              key=${job.id}
              job=${job}
              onClick=${()=>{ if(job.status==='pending') setSelected(job); }}
            />
          `)}
        </div>

        <div style=${{
          textAlign:'center', marginTop:24,
          ...mono, fontSize:10, color:'rgba(255,255,255,0.15)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
        }}>
          <span style=${{ color:'#10b981', fontSize:7, animation:'pulse 1.5s infinite' }}>●</span>
          LIVE UPDATES · SUPABASE REALTIME
        </div>
      </div>

      ${selected && html`
        <${DiscountPanel}
          job=${selected}
          onClose=${()=>setSelected(null)}
          onApprove=${()=>setSelected(null)}
          onDeny=${()=>setSelected(null)}
        />
      `}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ROOT — URL ROUTING  (?view=analyst for analyst desk, ?view=prospect default)
════════════════════════════════════════════════════════════════════════════════ */
function App() {
  const params  = new URLSearchParams(window.location.search);
  const view    = params.get('view') || 'prospect';
  const repName = params.get('rep')  || '';

  if(view === 'analyst' || view === 'rep') return html`<${AnalystApp} repName=${repName} />`;
  return html`<${ProspectApp} repName=${repName} />`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
