<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alder Security — Get Started</title>

  <script type="importmap">
  {
    "imports": {
      "react":             "https://esm.sh/react@18",
      "react-dom/client":  "https://esm.sh/react-dom@18/client",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
      "htm":               "https://esm.sh/htm@3"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: #080b12;
      color: #f1f5f9;
      font-family: 'Rajdhani', system-ui, sans-serif;
      font-size: 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }
    input, select, button, textarea { font-family: inherit; font-size: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; }
    ::placeholder { color: rgba(255,255,255,0.18); }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(16,185,129,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #root { position: relative; z-index: 1; }

    @keyframes fadeUp   { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn   { from{opacity:0} to{opacity:1} }
    @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes spin     { to{transform:rotate(360deg)} }
    @keyframes shimmer  { 0%{background-position:200% center} 100%{background-position:-200% center} }
    @keyframes float    { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-8px)} }
    @keyframes checkPop { 0%{transform:scale(0) rotate(-10deg);opacity:0} 70%{transform:scale(1.2) rotate(3deg)} 100%{transform:scale(1) rotate(0deg);opacity:1} }
    @keyframes successRing { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
    @keyframes ticker { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }
    @keyframes slideStep { from{opacity:0;transform:translateX(24px)} to{opacity:1;transform:translateX(0)} }

    .fade  { animation: fadeUp .4s cubic-bezier(.16,1,.3,1) both; }
    .fade2 { animation: fadeUp .4s cubic-bezier(.16,1,.3,1) .1s both; }
    .fade3 { animation: fadeUp .4s cubic-bezier(.16,1,.3,1) .2s both; }
    .slide { animation: slideStep .35s cubic-bezier(.16,1,.3,1) both; }

    input[type=text]:focus, input[type=email]:focus, input[type=tel]:focus,
    input[type=number]:focus, select:focus, textarea:focus {
      border-color: rgba(16,185,129,0.6) !important;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
    }

    select option { background: #131720; color: #f1f5f9; }

    .field-row { display: grid; gap: 12px; }
    @media (min-width: 520px) { .two-col { grid-template-columns: 1fr 1fr; } }

    .ticker-wrap {
      overflow: hidden;
      white-space: nowrap;
      mask-image: linear-gradient(90deg, transparent, black 10%, black 90%, transparent);
    }
    .ticker-inner { display: inline-block; animation: ticker 28s linear infinite; }
  </style>
</head>

<body>
<div id="root"></div>

<script type="module">
import { createElement as h, useState, useEffect, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import { createClient } from '@supabase/supabase-js';
import htm from 'htm';

const html = htm.bind(h);

const SUPABASE_URL      = 'https://jhiwjizymcqsevlnmfth.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpoaXdqaXp5bWNxc2V2bG5tZnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4OTM5MjQsImV4cCI6MjA5NDQ2OTkyNH0.CE8pYqJU7f5eQDblTXWnbGyulUlKxDaj-wRJaVU4avM';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── Style helpers ──────────────────────────────────────────────────────────────

const mono = { fontFamily: "'Share Tech Mono', monospace" };

const lbl = {
  display: 'block',
  fontSize: 10,
  color: 'rgba(255,255,255,0.3)',
  letterSpacing: '.14em',
  textTransform: 'uppercase',
  fontFamily: "'Share Tech Mono', monospace",
  marginBottom: 7,
};

const inp = (extra = {}) => ({
  width: '100%',
  padding: '13px 15px',
  borderRadius: 10,
  border: '1px solid rgba(255,255,255,0.09)',
  background: 'rgba(255,255,255,0.04)',
  color: '#f1f5f9',
  fontSize: 15,
  fontWeight: 500,
  transition: 'border-color .2s, box-shadow .2s',
  ...extra,
});

const btn = (bg = '#10b981', extra = {}) => ({
  padding: '14px 24px',
  borderRadius: 11,
  border: 'none',
  background: bg,
  color: 'white',
  fontWeight: 700,
  cursor: 'pointer',
  fontSize: 15,
  fontFamily: 'inherit',
  transition: 'opacity .15s, transform .1s',
  letterSpacing: '.04em',
  ...extra,
});

const card = (extra = {}) => ({
  background: '#111520',
  border: '1px solid rgba(255,255,255,0.07)',
  borderRadius: 16,
  ...extra,
});

// ── Ticker bar ─────────────────────────────────────────────────────────────────

function Ticker() {
  const items = [
    '🛡️  Professional 24/7 monitoring',
    '📱  Control from anywhere',
    '⚡  Instant alarm response',
    '🔋  Backup power protection',
    '🏠  180,000+ homes protected',
    '📡  Always-on communication',
    '🎯  No-contract flexibility',
    '🌙  Sleep soundly every night',
  ];
  const text = items.join('     ·     ');

  return html`
    <div class="ticker-wrap" style=${{
      borderBottom: '1px solid rgba(255,255,255,0.05)',
      padding: '10px 0',
      background: 'rgba(16,185,129,0.04)',
    }}>
      <div class="ticker-inner" style=${{
        ...mono, fontSize: 11, color: 'rgba(16,185,129,0.55)',
        letterSpacing: '.08em',
      }}>
        ${text}     ·     ${text}
      </div>
    </div>
  `;
}

// ── Spinner ────────────────────────────────────────────────────────────────────

function Spinner({ size = 18, color = 'white' }) {
  return h('div', {
    style: {
      width: size, height: size, borderRadius: '50%',
      border: `2px solid rgba(255,255,255,0.15)`,
      borderTopColor: color,
      animation: 'spin .65s linear infinite',
      display: 'inline-block',
      flexShrink: 0,
    }
  });
}

// ── Step indicator ─────────────────────────────────────────────────────────────

function StepDots({ step, total }) {
  return h('div', {
    style: { display: 'flex', gap: 7, justifyContent: 'center', marginBottom: 28 }
  },
    Array.from({ length: total }, (_, i) =>
      h('div', {
        key: i,
        style: {
          width: i === step ? 22 : 7,
          height: 7,
          borderRadius: 4,
          background: i === step ? '#10b981' : i < step ? 'rgba(16,185,129,0.35)' : 'rgba(255,255,255,0.1)',
          transition: 'all .3s cubic-bezier(.16,1,.3,1)',
        }
      })
    )
  );
}

// ── Trust badges ───────────────────────────────────────────────────────────────

function TrustBar() {
  const items = [
    { icon: '🔒', text: 'SSL Encrypted' },
    { icon: '🛡️', text: 'Since 2012' },
    { icon: '⭐', text: '4.8 / 5 Stars' },
    { icon: '📞', text: '24/7 Support' },
  ];
  return h('div', {
    style: {
      display: 'flex', gap: 0, flexWrap: 'wrap',
      borderTop: '1px solid rgba(255,255,255,0.05)',
      marginTop: 28,
    }
  },
    items.map((item, i) =>
      h('div', {
        key: i,
        style: {
          flex: '1 1 50%',
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '12px 16px',
          borderRight: i % 2 === 0 ? '1px solid rgba(255,255,255,0.05)' : 'none',
          borderBottom: i < 2 ? '1px solid rgba(255,255,255,0.05)' : 'none',
        }
      },
        h('span', { style: { fontSize: 16 } }, item.icon),
        h('span', { style: { ...mono, fontSize: 10, color: 'rgba(255,255,255,0.3)', letterSpacing: '.06em' } }, item.text)
      )
    )
  );
}

// ── STEP 1: Contact info ───────────────────────────────────────────────────────

function Step1({ form, setField, onNext }) {
  const [err, setErr] = useState('');

  function validate(e) {
    e.preventDefault();
    if (!form.first_name.trim() || !form.last_name.trim()) return setErr('Please enter your full name.');
    if (!form.phone.trim() && !form.email.trim()) return setErr('Please enter a phone number or email.');
    setErr('');
    onNext();
  }

  return html`
    <div class="slide">
      <h2 style=${{ fontSize: 22, fontWeight: 700, marginBottom: 5 }}>Let's get you set up</h2>
      <p style=${{ color: 'rgba(255,255,255,0.35)', fontSize: 14, marginBottom: 24, lineHeight: 1.5 }}>
        Your rep will use this to confirm your appointment and send updates.
      </p>

      <form onSubmit=${validate}>
        <div class="field-row two-col" style=${{ marginBottom: 12 }}>
          <div>
            <label style=${lbl}>First Name *</label>
            <input
              type="text"
              value=${form.first_name}
              onChange=${e => setField('first_name', e.target.value)}
              placeholder="Jane"
              style=${inp()}
              autoFocus
            />
          </div>
          <div>
            <label style=${lbl}>Last Name *</label>
            <input
              type="text"
              value=${form.last_name}
              onChange=${e => setField('last_name', e.target.value)}
              placeholder="Smith"
              style=${inp()}
            />
          </div>
        </div>

        <div style=${{ marginBottom: 12 }}>
          <label style=${lbl}>Phone Number</label>
          <input
            type="tel"
            value=${form.phone}
            onChange=${e => setField('phone', e.target.value)}
            placeholder="(601) 555-0100"
            style=${inp()}
          />
        </div>

        <div style=${{ marginBottom: 20 }}>
          <label style=${lbl}>Email Address</label>
          <input
            type="email"
            value=${form.email}
            onChange=${e => setField('email', e.target.value)}
            placeholder="jane@email.com"
            style=${inp()}
          />
        </div>

        ${err && html`
          <div style=${{
            color: '#f87171', fontSize: 13, marginBottom: 14,
            ...mono, background: 'rgba(248,113,113,0.07)',
            border: '1px solid rgba(248,113,113,0.2)',
            padding: '10px 14px', borderRadius: 8,
          }}>${err}</div>
        `}

        <button type="submit" style=${{ ...btn(), width: '100%', fontSize: 16, padding: '15px' }}>
          Continue →
        </button>
      </form>
    </div>
  `;
}

// ── STEP 2: Address ────────────────────────────────────────────────────────────

function Step2({ form, setField, onNext, onBack }) {
  const [err, setErr] = useState('');

  function validate(e) {
    e.preventDefault();
    if (!form.address.trim() || !form.city.trim() || !form.state.trim()) {
      return setErr('Please fill in your street address, city, and state.');
    }
    setErr('');
    onNext();
  }

  const US_STATES = [
    'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA',
    'KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
    'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT',
    'VA','WA','WV','WI','WY'
  ];

  return html`
    <div class="slide">
      <h2 style=${{ fontSize: 22, fontWeight: 700, marginBottom: 5 }}>Where's the home?</h2>
      <p style=${{ color: 'rgba(255,255,255,0.35)', fontSize: 14, marginBottom: 24, lineHeight: 1.5 }}>
        This is where your system will be installed and monitored.
      </p>

      <form onSubmit=${validate}>
        <div style=${{ marginBottom: 12 }}>
          <label style=${lbl}>Street Address *</label>
          <input
            type="text"
            value=${form.address}
            onChange=${e => setField('address', e.target.value)}
            placeholder="123 Maple Street"
            style=${inp()}
            autoFocus
          />
        </div>

        <div class="field-row two-col" style=${{ marginBottom: 12 }}>
          <div>
            <label style=${lbl}>City *</label>
            <input
              type="text"
              value=${form.city}
              onChange=${e => setField('city', e.target.value)}
              placeholder="Springfield"
              style=${inp()}
            />
          </div>
          <div>
            <label style=${lbl}>State *</label>
            <select
              value=${form.state}
              onChange=${e => setField('state', e.target.value)}
              style=${{ ...inp(), cursor: 'pointer' }}
            >
              <option value="">— Select —</option>
              ${US_STATES.map(s => html`<option key=${s} value=${s}>${s}</option>`)}
            </select>
          </div>
        </div>

        <div style=${{ marginBottom: 20 }}>
          <label style=${lbl}>ZIP Code</label>
          <input
            type="text"
            value=${form.zip}
            onChange=${e => setField('zip', e.target.value)}
            placeholder="39401"
            style=${inp({ maxWidth: 160 })}
            maxLength="10"
          />
        </div>

        ${err && html`
          <div style=${{
            color: '#f87171', fontSize: 13, marginBottom: 14,
            ...mono, background: 'rgba(248,113,113,0.07)',
            border: '1px solid rgba(248,113,113,0.2)',
            padding: '10px 14px', borderRadius: 8,
          }}>${err}</div>
        `}

        <div style=${{ display: 'flex', gap: 10 }}>
          <button type="button" onClick=${onBack} style=${{
            ...btn('rgba(255,255,255,0.06)'),
            flex: '0 0 auto', padding: '15px 20px',
            color: 'rgba(255,255,255,0.45)',
          }}>←</button>
          <button type="submit" style=${{ ...btn(), flex: 1, fontSize: 16, padding: '15px' }}>
            Continue →
          </button>
        </div>
      </form>
    </div>
  `;
}

// ── STEP 3: Review & agree ─────────────────────────────────────────────────────

function Step3({ form, setField, onBack, onSubmit, submitting, repName }) {
  const [agreed, setAgreed] = useState(false);
  const [err, setErr]       = useState('');

  function handleSubmit(e) {
    e.preventDefault();
    if (!agreed) return setErr('Please check the box to continue.');
    setErr('');
    onSubmit();
  }

  const fullName    = [form.first_name, form.last_name].filter(Boolean).join(' ');
  const fullAddress = [form.address, form.city, form.state, form.zip].filter(Boolean).join(', ');
  const contact     = form.phone || form.email;

  const reviewRows = [
    { label: 'Name',    value: fullName },
    { label: 'Contact', value: [form.phone, form.email].filter(Boolean).join(' · ') || '—' },
    { label: 'Address', value: fullAddress || '—' },
  ];

  return html`
    <div class="slide">
      <h2 style=${{ fontSize: 22, fontWeight: 700, marginBottom: 5 }}>Confirm your info</h2>
      <p style=${{ color: 'rgba(255,255,255,0.35)', fontSize: 14, marginBottom: 22, lineHeight: 1.5 }}>
        Make sure everything looks right before we lock you in.
      </p>

      <div style=${{
        border: '1px solid rgba(255,255,255,0.08)',
        borderRadius: 12,
        overflow: 'hidden',
        marginBottom: 20,
      }}>
        ${reviewRows.map((row, i) => html`
          <div key=${i} style=${{
            display: 'flex', gap: 16, padding: '13px 16px',
            borderBottom: i < reviewRows.length - 1 ? '1px solid rgba(255,255,255,0.05)' : 'none',
            alignItems: 'flex-start',
          }}>
            <div style=${{ ...mono, fontSize: 10, color: 'rgba(255,255,255,0.25)', letterSpacing: '.1em', minWidth: 64, paddingTop: 2 }}>${row.label}</div>
            <div style=${{ fontSize: 14, fontWeight: 600, color: '#e2e8f0', lineHeight: 1.4 }}>${row.value}</div>
          </div>
        `)}
        ${form.notes.trim() && html`
          <div style=${{ display: 'flex', gap: 16, padding: '13px 16px', alignItems: 'flex-start' }}>
            <div style=${{ ...mono, fontSize: 10, color: 'rgba(255,255,255,0.25)', letterSpacing: '.1em', minWidth: 64, paddingTop: 2 }}>Notes</div>
            <div style=${{ fontSize: 14, fontWeight: 600, color: '#e2e8f0', lineHeight: 1.4 }}>${form.notes}</div>
          </div>
        `}
      </div>

      <div style=${{ marginBottom: 20 }}>
        <label style=${lbl}>Anything else for your tech? (optional)</label>
        <textarea
          value=${form.notes}
          onChange=${e => setField('notes', e.target.value)}
          placeholder="Gate code, dogs at home, preferred time window…"
          rows="2"
          style=${{ ...inp(), resize: 'vertical', lineHeight: 1.5 }}
        />
      </div>

      <form onSubmit=${handleSubmit}>
        <label style=${{
          display: 'flex', alignItems: 'flex-start', gap: 12,
          cursor: 'pointer', padding: '14px 16px',
          background: agreed ? 'rgba(16,185,129,0.07)' : 'rgba(255,255,255,0.03)',
          border: `1px solid ${agreed ? 'rgba(16,185,129,0.3)' : 'rgba(255,255,255,0.07)'}`,
          borderRadius: 10, marginBottom: 16,
          transition: 'all .2s',
        }}>
          <input
            type="checkbox"
            checked=${agreed}
            onChange=${e => { setAgreed(e.target.checked); if(e.target.checked) setErr(''); }}
            style=${{ width: 18, height: 18, marginTop: 2, cursor: 'pointer', accentColor: '#10b981', flexShrink: 0 }}
          />
          <span style=${{ fontSize: 13, color: 'rgba(255,255,255,0.5)', lineHeight: 1.55 }}>
            I authorize Alder Security to contact me at the information provided to schedule my installation.
            I confirm this is my residence and I am authorized to have a security system installed.
          </span>
        </label>

        ${err && html`
          <div style=${{
            color: '#f87171', fontSize: 13, marginBottom: 14,
            ...mono, background: 'rgba(248,113,113,0.07)',
            border: '1px solid rgba(248,113,113,0.2)',
            padding: '10px 14px', borderRadius: 8,
          }}>${err}</div>
        `}

        <div style=${{ display: 'flex', gap: 10 }}>
          <button type="button" onClick=${onBack} disabled=${submitting} style=${{
            ...btn('rgba(255,255,255,0.06)'),
            flex: '0 0 auto', padding: '15px 20px',
            color: 'rgba(255,255,255,0.45)',
          }}>←</button>
          <button type="submit" disabled=${submitting} style=${{
            ...btn(agreed ? '#10b981' : 'rgba(255,255,255,0.08)'),
            flex: 1, fontSize: 16, padding: '15px',
            opacity: submitting ? .7 : 1,
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
            color: agreed ? 'white' : 'rgba(255,255,255,0.3)',
            cursor: agreed ? 'pointer' : 'default',
          }}>
            ${submitting
              ? html`<${Spinner} size=${18} /> Locking you in…`
              : '🛡️  Confirm & Submit'
            }
          </button>
        </div>
      </form>
    </div>
  `;
}

// ── Success screen ─────────────────────────────────────────────────────────────

function SuccessScreen({ repName, name }) {
  const nextSteps = [
    { icon: '📞', title: 'Confirmation call', desc: `${repName ? repName : 'Your rep'} will confirm your appointment time shortly.` },
    { icon: '🚗', title: 'Tech en route', desc: 'Your installer will reach out before they head your way.' },
    { icon: '🛡️', title: 'System armed', desc: 'Within hours, your home will be under professional protection 24/7.' },
  ];

  return html`
    <div style=${{ textAlign: 'center', padding: '8px 0 4px', animation: 'successRing .5s cubic-bezier(.16,1,.3,1) both' }}>

      <div style=${{
        width: 80, height: 80, borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(16,185,129,0.05) 100%)',
        border: '2px solid rgba(16,185,129,0.5)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: 34, margin: '0 auto 20px',
        boxShadow: '0 0 40px rgba(16,185,129,0.3)',
        animation: 'checkPop .5s cubic-bezier(.16,1,.3,1) .2s both',
      }}>
        ✓
      </div>

      <div style=${{
        ...mono, fontSize: 10, color: '#10b981', letterSpacing: '.2em',
        marginBottom: 8,
      }}>YOU'RE IN</div>

      <h2 style=${{ fontSize: 26, fontWeight: 700, marginBottom: 8, lineHeight: 1.2 }}>
        Welcome to the family${name ? `, ${name.split(' ')[0]}` : ''}!
      </h2>

      <p style=${{ color: 'rgba(255,255,255,0.4)', fontSize: 14, lineHeight: 1.6, marginBottom: 28, maxWidth: 320, margin: '0 auto 28px' }}>
        Your info is locked in. Here's what happens next:
      </p>

      <div style=${{ textAlign: 'left', marginBottom: 28 }}>
        ${nextSteps.map((step, i) => html`
          <div key=${i} style=${{
            display: 'flex', gap: 14, marginBottom: i < nextSteps.length - 1 ? 0 : 0,
            padding: '14px 0',
            borderBottom: i < nextSteps.length - 1 ? '1px solid rgba(255,255,255,0.05)' : 'none',
            animation: `fadeUp .4s cubic-bezier(.16,1,.3,1) ${.3 + i * .1}s both`,
          }}>
            <div style=${{
              width: 38, height: 38, borderRadius: 10, flexShrink: 0,
              background: 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.2)',
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 17,
            }}>${step.icon}</div>
            <div>
              <div style=${{ fontSize: 14, fontWeight: 700, marginBottom: 3 }}>${step.title}</div>
              <div style=${{ fontSize: 13, color: 'rgba(255,255,255,0.4)', lineHeight: 1.5 }}>${step.desc}</div>
            </div>
          </div>
        `)}
      </div>

      <div style=${{
        background: 'rgba(16,185,129,0.06)',
        border: '1px solid rgba(16,185,129,0.15)',
        borderRadius: 12, padding: '14px 16px',
        ...mono, fontSize: 11, color: 'rgba(16,185,129,0.7)',
        lineHeight: 1.6, letterSpacing: '.04em',
        animation: 'fadeUp .4s cubic-bezier(.16,1,.3,1) .6s both',
      }}>
        🎉 You just made the best decision for your home.
        <br />Welcome to the most protected house on your block.
      </div>
    </div>
  `;
}

// ── Main App ───────────────────────────────────────────────────────────────────

function App() {
  const params  = new URLSearchParams(window.location.search);
  const repName = params.get('rep') || '';
  const repTech = params.get('tech') || repName;  // tech to assign

  const [step, setStep]           = useState(0);
  const [submitting, setSubmitting] = useState(false);
  const [submitted, setSubmitted]  = useState(false);
  const [submitErr, setSubmitErr]  = useState('');

  const [form, setFormState] = useState({
    first_name: '',
    last_name:  '',
    phone:      '',
    email:      '',
    address:    '',
    city:       '',
    state:      '',
    zip:        '',
    notes:      '',
  });

  function setField(key, val) {
    setFormState(f => ({ ...f, [key]: val }));
  }

  async function handleSubmit() {
    setSubmitting(true);
    setSubmitErr('');

    const fullName    = [form.first_name, form.last_name].filter(Boolean).join(' ');
    const fullAddress = [form.address, form.city, form.state, form.zip].filter(Boolean).join(', ');
    const contact     = form.phone.trim() || form.email.trim();

    const payload = {
      customer_name:  fullName,
      contact:        contact,
      address:        fullAddress || null,
      status:         'confirmed',
      tech_name:      repTech || null,
      notes:          form.notes.trim() || null,
      queue_position: null,
      eta:            null,
    };

    // Also store email separately in notes if both provided
    if (form.phone.trim() && form.email.trim()) {
      payload.notes = [
        form.email.trim(),
        form.notes.trim(),
      ].filter(Boolean).join(' | ') || null;
    }

    const { error } = await sb.from('alder_jobs').insert([payload]);

    setSubmitting(false);

    if (error) {
      console.error(error);
      setSubmitErr('Something went wrong. Please try again or tell your rep.');
      return;
    }

    setSubmitted(true);
  }

  const TOTAL_STEPS = 3;

  return html`
    <div style=${{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      <${Ticker} />

      <!-- Header -->
      <div style=${{
        padding: '18px 24px',
        borderBottom: '1px solid rgba(255,255,255,0.05)',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      }}>
        <div style=${{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style=${{ fontSize: 18 }}>🛡️</span>
          <div>
            <div style=${{ ...mono, fontSize: 10, color: '#10b981', letterSpacing: '.14em' }}>ALDER SECURITY</div>
            ${repName && html`
              <div style=${{ fontSize: 11, color: 'rgba(255,255,255,0.25)', marginTop: 1 }}>
                Sent by ${repName}
              </div>
            `}
          </div>
        </div>
        <div style=${{
          ...mono, fontSize: 10, color: 'rgba(255,255,255,0.2)',
          display: 'flex', alignItems: 'center', gap: 6,
        }}>
          <span style=${{ color: '#10b981', fontSize: 8, animation: 'pulse 2s infinite' }}>●</span>
          SECURE FORM
        </div>
      </div>

      <!-- Body -->
      <div style=${{ flex: 1, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '32px 20px 60px' }}>
        <div style=${{ width: '100%', maxWidth: 480 }}>

          ${!submitted && html`
            <div class="fade" style=${{ marginBottom: 28 }}>
              <!-- Hero line -->
              <div style=${{
                ...mono, fontSize: 10, color: '#10b981',
                letterSpacing: '.18em', marginBottom: 10,
              }}>
                STEP ${step + 1} OF ${TOTAL_STEPS}
              </div>
              <${StepDots} step=${step} total=${TOTAL_STEPS} />
            </div>
          `}

          <!-- Card -->
          <div style=${{
            ...card({ padding: '28px 24px 24px' }),
            boxShadow: '0 24px 80px rgba(0,0,0,0.5)',
          }}>
            ${!submitted && html`
              <!-- Step router -->
              ${step === 0 && html`
                <${Step1}
                  form=${form}
                  setField=${setField}
                  onNext=${() => setStep(1)}
                />
              `}
              ${step === 1 && html`
                <${Step2}
                  form=${form}
                  setField=${setField}
                  onNext=${() => setStep(2)}
                  onBack=${() => setStep(0)}
                />
              `}
              ${step === 2 && html`
                <${Step3}
                  form=${form}
                  setField=${setField}
                  onBack=${() => setStep(1)}
                  onSubmit=${handleSubmit}
                  submitting=${submitting}
                  repName=${repName}
                />
              `}
              ${submitErr && html`
                <div style=${{
                  color: '#f87171', fontSize: 13, marginTop: 14,
                  ...mono, background: 'rgba(248,113,113,0.07)',
                  border: '1px solid rgba(248,113,113,0.2)',
                  padding: '10px 14px', borderRadius: 8,
                }}>${submitErr}</div>
              `}
            `}

            ${submitted && html`
              <${SuccessScreen}
                repName=${repName}
                name=${[form.first_name, form.last_name].filter(Boolean).join(' ')}
              />
            `}

            <${TrustBar} />
          </div>

          <!-- Reassurance copy -->
          ${!submitted && html`
            <div style=${{
              textAlign: 'center', marginTop: 18,
              ...mono, fontSize: 11, color: 'rgba(255,255,255,0.18)',
              lineHeight: 1.7, letterSpacing: '.04em',
            }}>
              Your info is encrypted and never sold.<br />
              Alder Security · ©${new Date().getFullYear()}
            </div>
          `}

        </div>
      </div>
    </div>
  `;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
