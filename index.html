/* ─── SSN Input with masking ─────────────────────────────────────────────────── */
function SSNInput({ value, onChange }) {
  const [showFull, setShowFull] = useState(false);
  const [rawVal, setRawVal]     = useState(value || '');

  function handleChange(e) {
    let v = e.target.value.replace(/\D/g,'').slice(0,9);
    setRawVal(v);
    // Format: XXX-XX-XXXX
    let formatted = v;
    if(v.length > 5) formatted = v.slice(0,3)+'-'+v.slice(3,5)+'-'+v.slice(5);
    else if(v.length > 3) formatted = v.slice(0,3)+'-'+v.slice(3);
    onChange(formatted);
  }

  const displayVal = showFull
    ? value
    : value
      ? '●●●-●●-' + (rawVal.slice(-4) || '____')
      : '';

  return h('div', { style:{ position:'relative' } },
    h('input', {
      type: showFull ? 'text' : 'text',
      value: showFull ? value : displayVal,
      onChange: showFull ? handleChange : ()=>{},
      onFocus: ()=> setShowFull(true),
      onBlur:  ()=> setShowFull(false),
      placeholder: '●●●-●●-●●●●',
      style: inp({ letterSpacing: showFull ? 'normal' : '3px' }),
      autoComplete: 'off',
      inputMode: 'numeric',
    }),
    h('button', {
      type:'button',
      onClick:()=> setShowFull(f=>!f),
      style:{
        position:'absolute', right:12, top:'50%', transform:'translateY(-50%)',
        background:'none', border:'none', cursor:'pointer',
        color:'rgba(255,255,255,0.25)', fontSize:12, ...mono,
        padding:'4px 6px',
      }
    }, showFull ? 'HIDE' : 'SHOW')
  );
}

/* ─── Waiting Screen ──────────────────────────────────────────────────────────── */
function WaitingScreen({ rowId, repName, onApproved, onDenied }) {
  const [dots, setDots]   = useState('');
  const [phase, setPhase] = useState('submitting'); // submitting → waiting → done

  useEffect(()=>{
    // Animate dots
    const iv = setInterval(()=> setDots(d=> d.length>=3?'':d+'.'), 500);
    // After 1.5s, transition to waiting
    const t1 = setTimeout(()=> setPhase('waiting'), 1500);
    return ()=>{ clearInterval(iv); clearTimeout(t1); };
  },[]);

  useEffect(()=>{
    if(!rowId) return;
    const ch = sb.channel(`approval-${rowId}`)
      .on('postgres_changes',{
        event:'UPDATE', schema:'public', table:'site_approvals',
        filter:`id=eq.${rowId}`,
      }, payload => {
        const s = payload.new?.status;
        if(s==='approved') onApproved(payload.new);
        if(s==='denied')   onDenied(payload.new);
      })
      .subscribe();
    return ()=> sb.removeChannel(ch);
  },[rowId]);

  const stages = [
    { id:'encrypt',  label:'Encrypting personal data',     done:true  },
    { id:'submit',   label:'Transmitting to underwriting',  done:true  },
    { id:'rep',      label:'Waiting for rep activation',    done:false },
    { id:'approve',  label:'Approval pending',              done:false },
  ];

  return html`
    <div class="scan-wrap fade" style=${{ padding:'8px 0' }}>
      <div class="scan-line"></div>

      <!-- Icon -->
      <div style=${{
        width:72, height:72, borderRadius:'50%', margin:'0 auto 20px',
        background:'rgba(16,185,129,0.08)',
        border:'2px solid rgba(16,185,129,0.3)',
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:28,
        animation:'breathe 2.5s ease-in-out infinite',
      }}>⏳</div>

      <div style=${{ textAlign:'center', marginBottom:28 }}>
        <div style=${{ ...mono, fontSize:10, color:'#10b981', letterSpacing:'.2em', marginBottom:8 }}>
          ${phase==='submitting' ? 'TRANSMITTING'+dots : 'AWAITING REP ACTIVATION'+dots}
        </div>
        <h2 style=${{ fontSize:22, fontWeight:700, lineHeight:1.2 }}>
          ${phase==='submitting' ? 'Sending to underwriting…' : 'Your rep is reviewing'}
        </h2>
        <p style=${{ color:'rgba(255,255,255,0.3)', fontSize:13.5, marginTop:6, lineHeight:1.5 }}>
          ${repName ? `${repName} will ` : 'Your rep will '}activate your package in just a moment.
          <br/>Keep this screen open.
        </p>
      </div>

      <!-- Progress stages -->
      <div style=${{ marginBottom:24 }}>
        ${stages.map((st,i)=>html`
          <div key=${st.id} style=${{
            display:'flex', alignItems:'center', gap:12, padding:'11px 0',
            borderBottom: i<stages.length-1 ? '1px solid rgba(255,255,255,0.05)' : 'none',
          }}>
            <div style=${{
              width:28, height:28, borderRadius:'50%', flexShrink:0,
              background: st.done ? 'rgba(16,185,129,0.15)' : 'rgba(255,255,255,0.04)',
              border:`1px solid ${st.done ? 'rgba(16,185,129,0.4)' : 'rgba(255,255,255,0.1)'}`,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:12,
            }}>
              ${st.done ? '✓' : i===2 ? html`<${Spinner} size=${12} />` : '○'}
            </div>
            <div style=${{
              ...mono, fontSize:11,
              color: st.done ? 'rgba(16,185,129,0.7)' : i===2 ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)',
              letterSpacing:'.04em',
            }}>${st.label}</div>
          </div>
        `)}
      </div>

      <div style=${{
        padding:'12px 14px', background:'rgba(245,158,11,0.06)',
        border:'1px solid rgba(245,158,11,0.15)', borderRadius:10,
        ...mono, fontSize:10.5, color:'rgba(245,158,11,0.6)',
        lineHeight:1.6, letterSpacing:'.03em',
      }}>
        ⚠️ Do not close this tab — your approval will appear here automatically once your rep confirms the package.
      </div>
    </div>
  `;
}

/* ─── Prospect App ────────────────────────────────────────────────────────────── */
function ProspectApp({ repName }) {
  const [step, setStep]           = useState(0);
  const [submitting, setSubmitting] = useState(false);
  const [rowId, setRowId]         = useState(null);
  const [approvedData, setApproved] = useState(null);
  const [denied, setDenied]       = useState(false);
  const [submitErr, setSubmitErr] = useState('');

  const [form, setFormState] = useState({
    first_name:'', last_name:'', phone:'', email:'',
    address:'', city:'', state:'', zip:'',
    dob:'', ssn:'',
  });
  const set = (k,v) => setFormState(f=>({...f,[k]:v}));

  async function handleSubmit() {
    setSubmitting(true); setSubmitErr('');
    const payload = {
      customer_name: [form.first_name, form.last_name].filter(Boolean).join(' '),
      phone:         form.phone || null,
      email:         form.email || null,
      address:       form.address || null,
      city:          form.city   || null,
      state:         form.state  || null,
      zip:           form.zip    || null,
      dob:           form.dob    || null,
      ssn:           form.ssn    || null,
      status:        'pending',
      rep_name:      repName    || null,
      monthly_rmr:   null,
      package_name:  null,
      panel_type:    null,
      sales_config:  null,
    };
    const { data, error } = await sb.from('site_approvals').insert([payload]).select().single();
    setSubmitting(false);
    if(error){ console.error(error); setSubmitErr('Submission failed. Please try again.'); return; }
    setRowId(data.id);
  }

  const TOTAL = 3;
  const name  = [form.first_name, form.last_name].filter(Boolean).join(' ');

  return html`
    <div style=${{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <${Ticker} />
      <${Header} repName=${repName} isRep=${false} />

      <div style=${{ flex:1, display:'flex', justifyContent:'center', padding:'28px 18px 60px' }}>
        <div style=${{ width:'100%', maxWidth:460 }}>

          ${!rowId && !denied && html`
            <div class="fade" style=${{ marginBottom:24 }}>
              <${StepDots} step=${step} total=${TOTAL} />
            </div>
          `}

          <div style=${{
            ...card({ padding:'26px 22px 22px' }),
            boxShadow:'0 24px 80px rgba(0,0,0,0.55)',
          }}>
            ${denied && html`<${DeniedScreen} repName=${repName} />`}

            ${approvedData && !denied && html`
              <${ApprovedScreen} record=${approvedData} customerName=${name} />
            `}

            ${rowId && !approvedData && !denied && html`
              <${WaitingScreen}
                rowId=${rowId}
                repName=${repName}
                onApproved=${d=>{ setApproved(d); }}
                onDenied=${()=> setDenied(true)}
              />
            `}

            ${!rowId && !denied && html`
              ${step===0 && html`<${PStep1} form=${form} set=${set} onNext=${()=>setStep(1)} />`}
              ${step===1 && html`<${PStep2} form=${form} set=${set} onNext=${()=>setStep(2)} onBack=${()=>setStep(0)} />`}
              ${step===2 && html`<${PStep3} form=${form} set=${set} onBack=${()=>setStep(1)} onSubmit=${handleSubmit} submitting=${submitting} />`}
              ${submitErr && html`
                <div style=${{ ...mono, color:'#f87171', fontSize:12, marginTop:12, padding:'10px 13px', background:'rgba(239,68,68,0.07)', border:'1px solid rgba(239,68,68,0.15)', borderRadius:8 }}>${submitErr}</div>
              `}
            `}

            <!-- Trust row -->
            <div style=${{ display:'flex', gap:0, flexWrap:'wrap', borderTop:'1px solid rgba(255,255,255,0.05)', marginTop:22 }}>
              ${[['🔒','SSL Encrypted'],['🛡️','Since 2012'],['⭐','4.8 Stars'],['📞','24/7 Support']].map(([icon,label],i)=>html`
                <div key=${i} style=${{
                  flex:'1 1 50%', display:'flex', alignItems:'center', gap:7, padding:'10px 14px',
                  borderRight: i%2===0?'1px solid rgba(255,255,255,0.05)':'none',
                  borderBottom: i<2?'1px solid rgba(255,255,255,0.05)':'none',

                  <span style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.25)', letterSpacing:'.06em' }}>${label}</span>
                </div>
              `)}
            </div>
          </div>

          <div style=${{ textAlign:'center', marginTop:16, ...mono, fontSize:10, color:'rgba(255,255,255,0.15)', lineHeight:1.7, letterSpacing:'.03em' }}>
            Your data is encrypted end-to-end and never sold.<br/>
            Alder Security · ©${new Date().getFullYear()}
          </div>
        </div>
      </div>
    </div>
  `;

/* ─── SSN display — rep can toggle full reveal ────────────────────────────────── */
function RepSSN({ ssn }) {
  const [show, setShow] = useState(false);
  if(!ssn) return h('span',{style:{color:'rgba(255,255,255,0.2)'}}, '—');
  const digits = ssn.replace(/\D/g,'');
  const last4  = digits.slice(-4);
  const masked = `●●●-●●-${last4}`;
  return h('div', { style:{ display:'flex', alignItems:'center', gap:8 } },
    h('span',{ style:{ ...mono, fontSize:13.5, fontWeight:600, color:'#e2e8f0', letterSpacing: show?'normal':'2px' }},
      show ? ssn : masked
    ),
    h('button', {
      type:'button',
      onClick:()=>setShow(s=>!s),
      style:{
        ...mono, fontSize:9, padding:'3px 8px', borderRadius:5, cursor:'pointer',
        background: show ? 'rgba(239,68,68,0.12)' : 'rgba(16,185,129,0.1)',
        border: show ? '1px solid rgba(239,68,68,0.25)' : '1px solid rgba(16,185,129,0.2)',
        color: show ? 'rgba(239,68,68,0.7)' : 'rgba(16,185,129,0.6)',
        letterSpacing:'.07em',
      }
    }, show ? 'HIDE' : 'REVEAL')
  );
}

            <div style=${{ display:'grid', gap:8, gridTemplateColumns: config==='declined' ? '1fr' : '1fr 1fr' }}>
              ${pkgList.map(pkg => html`
                <div key=${pkg.id} class="pkg-opt" onClick=${()=>setPkgId(pkg.id)} style=${{
                  padding:'14px 13px', borderRadius:11, cursor:'pointer',
                  background: pkgId===pkg.id ? 'rgba(16,185,129,0.1)' : 'rgba(255,255,255,0.03)',
                  border:`1.5px solid ${pkgId===pkg.id ? 'rgba(16,185,129,0.5)' : 'rgba(255,255,255,0.07)'}`,
                  transition:'all .18s',
                  position:'relative',
                }}>
                  ${pkgId===pkg.id && html`
                    <div style=${{ position:'absolute', top:8, right:8, width:7, height:7, borderRadius:'50%', background:'#10b981' }}></div>
                  `}
                  <div style=${{ fontSize:12.5, fontWeight:700, color: pkgId===pkg.id?'#e2e8f0':'rgba(255,255,255,0.5)', lineHeight:1.35, marginBottom:6 }}>
                    ${pkg.label}
                  </div>
                  <div style=${{ ...bebas, fontSize:24, color: pkgId===pkg.id?'#10b981':'rgba(255,255,255,0.25)', letterSpacing:'.03em' }}>
                    $${pkg.rmr.toFixed(2)}<span style=${{ fontSize:13, color:'rgba(16,185,129,0.4)' }}>/mo</span>
                  </div>
                </div>
              `)}
            </div>
          </div>

          <!-- Selected RMR summary -->
          <div style=${{
            display:'flex', justifyContent:'space-between', alignItems:'center',
            padding:'15px 18px', marginBottom:18,
            background:'linear-gradient(135deg,rgba(16,185,129,0.1),rgba(16,185,129,0.04))',
            border:'1px solid rgba(16,185,129,0.25)', borderRadius:12,
          }}>
            <div>
              <div style=${{ ...mono, fontSize:9, color:'rgba(16,185,129,0.5)', letterSpacing:'.14em', marginBottom:3 }}>LOCKED MONTHLY RATE</div>
              <div style=${{ fontSize:13, fontWeight:600, color:'rgba(255,255,255,0.6)' }}>${selected.label}</div>
            </div>
            <div style=${{ ...bebas, fontSize:34, color:'#10b981', letterSpacing:'.03em' }}>
              $${selected.rmr.toFixed(2)}
            </div>
          </div>

          <!-- Action buttons -->
          <div style=${{ display:'flex', gap:10 }}>
            <button onClick=${handleDeny} disabled=${denyLoad||loading} style=${{
              ...btn('rgba(239,68,68,0.1)'),
              flex:'0 0 auto', padding:'14px 18px', fontSize:14,
              border:'1px solid rgba(239,68,68,0.2)', color:'rgba(239,68,68,0.7)',
              display:'flex', alignItems:'center', gap:8,
            }}>
              ${denyLoad ? html`<${Spinner} size=${14} color="#ef4444"/>` : '✕'} Deny
            </button>
            <button onClick=${handleApprove} disabled=${loading||denyLoad} style=${{
              ...btn(config==='declined' ? '#b45309' : '#10b981'), flex:1, fontSize:15.5, padding:'14px',
              display:'flex', alignItems:'center', justifyContent:'center', gap:10,
              opacity: loading ? .75 : 1,
              boxShadow: config==='declined' ? '0 0 20px rgba(245,158,11,0.15)' : '0 0 30px rgba(16,185,129,0.3)',
            }}>
              ${loading ? html`<${Spinner} size=${16} /> Locking in…` : config==='declined' ? '⚠️  Approve Declined Package' : '🛡️  Approve & Lock In Rate'}
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ─── Rep: job list card ──────────────────────────────────────────────────────── */
function JobCard({ job, onClick }) {
  const age = (() => {
    const s = Math.floor((Date.now() - new Date(job.created_at).getTime()) / 1000);
    if(s < 60)  return `${s}s ago`;
    if(s < 3600) return `${Math.floor(s/60)}m ago`;
    return `${Math.floor(s/3600)}h ago`;
  })();

  const statusColor = {
    pending:  '#f59e0b',
    approved: '#10b981',
    denied:   '#ef4444',
  }[job.status] || '#999';

  return html`
    <div class="rep-card" onClick=${onClick} style=${{
      ...card({ padding:'14px 16px' }),
      display:'flex', gap:14, alignItems:'center',
      animation:'fadeUp .3s cubic-bezier(.16,1,.3,1) both',
    }}>
      <!-- Avatar -->
      <div style=${{
        width:42, height:42, borderRadius:10, flexShrink:0,
        background:`rgba(16,185,129,0.08)`,
        border:`1px solid rgba(16,185,129,0.15)`,
        display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:18,
      }}>👤</div>

      <div style=${{ flex:1, minWidth:0 }}>
        <div style=${{ fontWeight:700, fontSize:15, marginBottom:2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          ${job.customer_name || 'Unnamed Lead'}
        </div>
        <div style=${{ ...mono, fontSize:10, color:'rgba(255,255,255,0.3)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          ${job.phone||job.email||'—'} · ${[job.city,job.state].filter(Boolean).join(', ')||'No address'}
        </div>
      </div>

      <div style=${{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:5, flexShrink:0 }}>
        <div style=${{
          ...mono, fontSize:9, padding:'3px 8px', borderRadius:5,
          background:`rgba(${statusColor==='#f59e0b'?'245,158,11':statusColor==='#10b981'?'16,185,129':'239,68,68'},0.1)`,
          border:`1px solid rgba(${statusColor==='#f59e0b'?'245,158,11':statusColor==='#10b981'?'16,185,129':'239,68,68'},0.25)`,
          color:statusColor, letterSpacing:'.07em', textTransform:'uppercase',
        }}>${job.status}</div>
        <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.2)' }}>${age}</div>
      </div>
    </div>
  `;
}

/* ─── Rep Dashboard App ───────────────────────────────────────────────────────── */
function RepApp({ repName }) {
  const [jobs,    setJobs]    = useState([]);
  const [selected, setSelected] = useState(null);
  const [loading, setLoading]  = useState(true);
  const [filter,  setFilter]   = useState('all'); // all | pending | approved | denied

  // Initial load
  useEffect(()=>{
    async function load() {
      const { data } = await sb.from('site_approvals')
        .select('*')
        .order('created_at', { ascending:false })
        .limit(50);
      setJobs(data||[]);
      setLoading(false);
    }
    load();
  },[]);

  // Real-time subscription
  useEffect(()=>{
    const ch = sb.channel('rep-dashboard')
      .on('postgres_changes',{
        event:'INSERT', schema:'public', table:'site_approvals'
      }, payload => {
        setJobs(j => [payload.new, ...j]);
      })
      .on('postgres_changes',{
        event:'UPDATE', schema:'public', table:'site_approvals'
      }, payload => {
        setJobs(j => j.map(r => r.id===payload.new.id ? payload.new : r));
        // If we have this job open in the detail panel, update it
        setSelected(s => s && s.id===payload.new.id ? null : s);
      })
      .subscribe();
    return ()=> sb.removeChannel(ch);
  },[]);

  const filtered = jobs.filter(j => filter==='all' || j.status===filter);

  const counts = {
    all:     jobs.length,
    pending: jobs.filter(j=>j.status==='pending').length,
    approved:jobs.filter(j=>j.status==='approved').length,
    denied:  jobs.filter(j=>j.status==='denied').length,
  };

  function handleApprove(id) { setSelected(null); }
  function handleDeny(id)    { setSelected(null); }

  return html`
    <div style=${{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <${Ticker} />
      <${Header} repName=${repName||'Rep'} isRep=${true} />

      <div style=${{ flex:1, padding:'22px 18px 60px', maxWidth:640, margin:'0 auto', width:'100%' }}>

        <!-- Dashboard title -->
        <div class="fade" style=${{ marginBottom:22 }}>
          <div style=${{ ...bebas, fontSize:28, letterSpacing:'.07em', lineHeight:1 }}>SITE APPROVALS</div>
          <div style=${{ ...mono, fontSize:10, color:'rgba(255,255,255,0.25)', marginTop:4 }}>
            LIVE · ${counts.pending} PENDING · ${counts.approved} APPROVED
          </div>
        </div>

        <!-- Stats row -->
        <div class="fade2" style=${{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, marginBottom:20 }}>
          ${[
            { label:'Total',    val:counts.all,      color:'rgba(255,255,255,0.5)' },
            { label:'Pending',  val:counts.pending,  color:'#f59e0b' },
            { label:'Approved', val:counts.approved, color:'#10b981' },
          ].map(({label,val,color})=>html`
            <div style=${{
              ...card({ padding:'14px 14px' }),
              textAlign:'center',
            }}>
              <div style=${{ ...bebas, fontSize:30, color, letterSpacing:'.03em', lineHeight:1 }}>${val}</div>
              <div style=${{ ...mono, fontSize:9, color:'rgba(255,255,255,0.2)', marginTop:4, letterSpacing:'.1em' }}>${label}</div>
            </div>
          `)}
        </div>

        <!-- Filter tabs -->
        <div class="fade3" style=${{ display:'flex', gap:6, marginBottom:16 }}>
          ${['all','pending','approved','denied'].map(f=>html`
            <button key=${f} onClick=${()=>setFilter(f)} style=${{
              padding:'7px 14px', borderRadius:8, border:'none', cursor:'pointer', fontFamily:'inherit',
              background: filter===f ? 'rgba(16,185,129,0.15)' : 'rgba(255,255,255,0.04)',
              border:`1px solid ${filter===f ? 'rgba(16,185,129,0.35)' : 'rgba(255,255,255,0.07)'}`,
              color: filter===f ? '#10b981' : 'rgba(255,255,255,0.35)',
              fontSize:12, fontWeight:700, ...mono, letterSpacing:'.06em',
              textTransform:'uppercase', transition:'all .15s',
            }}>
              ${f} ${counts[f]>0?`(${counts[f]})`:''}
            </button>
          `)}
        </div>

        <!-- Job list -->
        ${loading && html`
          <div style=${{ display:'flex', justifyContent:'center', padding:'40px 0' }}>
            <${Spinner} size=${28} />
          </div>
        `}

        ${!loading && filtered.length===0 && html`
          <div style=${{
            textAlign:'center', padding:'50px 20px',
            ...mono, color:'rgba(255,255,255,0.2)', fontSize:12, letterSpacing:'.08em',
          }}>
            <div style=${{ fontSize:32, marginBottom:12 }}>📭</div>
            NO ${filter.toUpperCase()} LEADS YET<br/>
            <span style=${{ fontSize:10, color:'rgba(255,255,255,0.12)' }}>Waiting for prospects to submit…</span>
          </div>
        `}

        <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>
          ${filtered.map(job=>html`
            <${JobCard}
              key=${job.id}
              job=${job}
              onClick=${()=>{ if(job.status==='pending') setSelected(job); }}
            />
          `)}
        </div>

        <!-- Live indicator -->
        <div style=${{
          textAlign:'center', marginTop:24,
          ...mono, fontSize:10, color:'rgba(255,255,255,0.15)',
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
        }}>
          <span style=${{ color:'#10b981', fontSize:7, animation:'pulse 1.5s infinite' }}>●</span>
          LIVE UPDATES ENABLED · SUPABASE REALTIME
        </div>

      </div>

      ${selected && html`
        <${JobDetail}
          job=${selected}
          onClose=${()=>setSelected(null)}
          onApprove=${handleApprove}
          onDeny=${handleDeny}
        />
      `}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════════════════
   ROOT APP — URL ROUTING
════════════════════════════════════════════════════════════════════════════════ */
function App() {
  const params  = new URLSearchParams(window.location.search);
  const view    = params.get('view') || 'prospect';   // 'prospect' | 'rep'
  const repName = params.get('rep')  || '';

  if(view === 'rep') return html`<${RepApp} repName=${repName} />`;
  return html`<${ProspectApp} repName=${repName} />`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
